name: Digital Calm Daily Legacy Reel Publisher (Retired)

# Reel publication now uses the connected Metricool publisher, independently
# of GitHub's content generator. Do not add scheduled Buffer retries here.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the publishing handoff
        run: |
          echo "::warning title=Legacy publisher retired::DCD Reels use Metricool. This workflow cannot publish."
          echo "DCD Reel: not submitted. Use the connected Metricool publisher and reconcile dcd/reel_ledger.json before any recovery." >> "$GITHUB_STEP_SUMMARY"
