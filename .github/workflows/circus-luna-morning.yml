name: Circus Luna morning special
# Circus Peanuts account retirement requested by owner on 2026-11-01.
# No scheduled, push, or other automatic runs remain.
on:
  workflow_dispatch: {}

permissions:
  contents: write
concurrency:
  group: circus-peanuts-daily
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ false }}  # Permanently skip retired account workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow requests
      - name: Publish Luna once on October 2 at 7 AM Central
        env:
          CIRCUS_IG_ACCESS_TOKEN: ${{ secrets.CIRCUS_IG_ACCESS_TOKEN }}
          CIRCUS_IG_USER_ID: ${{ secrets.CIRCUS_IG_USER_ID }}
        run: python circus/publish_luna.py
