name: Circus Peanuts Daily

on:
  schedule:
    # Noon Chicago: CDT at 17 UTC, CST at 18 UTC. Script skips wrong DST slot.
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/circus-peanuts-daily.yml'

permissions:
  contents: write

concurrency:
  group: circus-peanuts-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Circus dependencies
        run: pip install Pillow requests
      - name: Publish and verify Circus daily post
        env:
          CIRCUS_IG_ACCESS_TOKEN: ${{ secrets.CIRCUS_IG_ACCESS_TOKEN }}
          CIRCUS_IG_USER_ID: ${{ secrets.CIRCUS_IG_USER_ID }}
        run: python circus/publish_daily.py
