name: Circus Peanuts Daily

on:
  schedule:
    # Noon Chicago, with backups at 12:17, 12:37, 13:17 and 13:37 local.
    # The script selects the current UTC offset and keeps the 12:00-14:00 window.
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
    # One shared backup expression avoids simultaneous DST-slot events.
    - cron: '17,37 17-19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: circus-peanuts-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Circus dependencies
        run: pip install Pillow requests
      - name: Test Circus schedule and duplicate safeguards
        run: python -m unittest discover -s circus/tests -v
      - name: Publish and verify Circus daily post
        env:
          CIRCUS_IG_ACCESS_TOKEN: ${{ secrets.CIRCUS_IG_ACCESS_TOKEN }}
          CIRCUS_IG_USER_ID: ${{ secrets.CIRCUS_IG_USER_ID }}
        run: python circus/publish_daily.py
