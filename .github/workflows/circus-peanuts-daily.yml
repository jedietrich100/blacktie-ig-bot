name: Circus Peanuts Daily

on:
  schedule:
    # Noon Chicago target; off-peak backups every 20 minutes through midnight.
    # Python applies the Chicago date/hour gate for DST and delayed starts.
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
    - cron: '7,27,47 17-23,0-5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: circus-peanuts-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Circus dependencies
        run: pip install Pillow requests
      - name: Test Circus schedule and duplicate safeguards
        run: python -m unittest discover -s circus/tests -v
      - name: Publish and verify Circus daily post
        env:
          CIRCUS_IG_ACCESS_TOKEN: ${{ secrets.CIRCUS_IG_ACCESS_TOKEN }}
          CIRCUS_IG_USER_ID: ${{ secrets.CIRCUS_IG_USER_ID }}
        run: python circus/publish_daily.py
      - name: Explain Circus publishing failure
        if: failure()
        run: |
          echo '::error title=Circus daily image NOT VERIFIED::Daily image publishing failed; no Instagram publication was verified by this run. If HTTP 401/code 190 appears, reauthorize @circuspeanutsdaily and update only CIRCUS_IG_ACCESS_TOKEN. The separate read-only audit checks live posts and both ledgers.'
          echo '### Circus daily image: failure — no verified publication from this run' >> "$GITHUB_STEP_SUMMARY"
          echo 'Daily image publishing failed; no Instagram publication was verified by this run. If HTTP 401/code 190 appears, reauthorize @circuspeanutsdaily and update only CIRCUS_IG_ACCESS_TOKEN. The separate read-only audit checks live posts and both ledgers.' >> "$GITHUB_STEP_SUMMARY"
