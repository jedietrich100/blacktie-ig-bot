name: Digital Calm Daily Content Generator

on:
  schedule:
    # Generate early in the Central-time morning. Publishing is handled
    # independently through Metricool so a social-channel outage cannot lose
    # the day's finished post.
    - cron: "0 11 * * *"
  workflow_dispatch: {}

concurrency:
  group: digital-calm-daily-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check whether today's content already exists
        id: duplicate
        run: |
          TODAY=$(TZ=America/Chicago date +%Y-%m-%d)
          if [ -f "docs/dcd-posts/${TODAY}.jpg" ] &&              [ -f "docs/dcd-posts/${TODAY}.txt" ] &&              [ -f "docs/dcd-posts/${TODAY}.json" ]; then
            echo "Today's Digital Calm Daily assets already exist; skipping generation."
            echo "new_post=false" >> "$GITHUB_OUTPUT"
          else
            echo "new_post=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.duplicate.outputs.new_post == 'true'
        run: |
          pip install -r requirements.txt
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Generate post, graphic, caption, and optional quick how-to Reel
        if: steps.duplicate.outputs.new_post == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 dcd/run_daily.py

      - name: Commit daily content
        if: steps.duplicate.outputs.new_post == 'true'
        run: |
          set -euo pipefail
          git config user.name "digital-calm-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dcd/history.json docs/dcd-posts
          if [ -d docs/dcd-reels ]; then
            git add docs/dcd-reels
          fi

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Digital Calm Daily: $(TZ=America/Chicago date +%Y-%m-%d)"

            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to push Digital Calm Daily content after 3 attempts"
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
