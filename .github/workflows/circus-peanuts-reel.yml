name: Circus Peanuts Evening Reel

# Circus Peanuts account retirement requested by owner on 2026-11-01.
# No scheduled, push, or other automatic runs remain.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Same account lock as existing Circus workflows; no overlap on account state.
  group: circus-peanuts-daily
  cancel-in-progress: false

jobs:
  reel:
    if: ${{ false }}  # Permanently skip retired account workflows
    # Owner-authorized daily silent Reels; config.json controls publication.
    # No repository-variable setup is required.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow requests
      - name: Install video renderer
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Test Circus safeguards
        run: python -m unittest discover -s circus/tests -v
      - name: Preview only on manual dispatch or code change
        if: github.event_name != 'schedule'
        run: python circus/reels/pipeline.py --preview --output preview/circus-reel
      - name: Verify Instagram credentials without publishing
        if: github.event_name == 'push'
        env:
          CIRCUS_IG_ACCESS_TOKEN: ${{ secrets.CIRCUS_IG_ACCESS_TOKEN }}
          CIRCUS_IG_USER_ID: ${{ secrets.CIRCUS_IG_USER_ID }}
        run: python circus/reels/pipeline.py --check-account
      - name: Run scheduled Circus production
        if: github.event_name == 'schedule'
        env:
          CIRCUS_IG_ACCESS_TOKEN: ${{ secrets.CIRCUS_IG_ACCESS_TOKEN }}
          CIRCUS_IG_USER_ID: ${{ secrets.CIRCUS_IG_USER_ID }}
        run: python circus/reels/pipeline.py
      - name: Upload reviewable Reel and script
        # Production assets are already committed; avoid repeatedly uploading
        # the entire growing media history on every backup attempt.
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: circus-reel-${{ github.run_id }}
          path: preview/circus-reel/
          if-no-files-found: ignore
          retention-days: 14
      - name: Explain Circus publishing failure
        if: failure()
        run: |
          echo '::error title=Circus evening Reel NOT VERIFIED::Evening Reel publishing failed; no Instagram publication was verified by this run. If HTTP 401/code 190 appears, reauthorize @circuspeanutsdaily and update only CIRCUS_IG_ACCESS_TOKEN. The separate read-only audit checks live posts and both ledgers.'
          echo '### Circus evening Reel: failure — no verified publication from this run' >> "$GITHUB_STEP_SUMMARY"
          echo 'Evening Reel publishing failed; no Instagram publication was verified by this run. If HTTP 401/code 190 appears, reauthorize @circuspeanutsdaily and update only CIRCUS_IG_ACCESS_TOKEN. The separate read-only audit checks live posts and both ledgers.' >> "$GITHUB_STEP_SUMMARY"
