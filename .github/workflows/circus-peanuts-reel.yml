name: Circus Peanuts Evening Reel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/circus-peanuts-reel.yml'
      - 'circus/reels/**'
      - 'circus/tests/test_reels.py'
      - '!circus/reels/state.json'
  schedule:
    # Target 6 PM Chicago; back up every 20 minutes until local midnight.
    # The Python date/hour gate handles DST and excludes the extra UTC slot.
    - cron: '0,20,40 23,0-5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Same account lock as existing Circus workflows; no overlap on account state.
  group: circus-peanuts-daily
  cancel-in-progress: false

jobs:
  reel:
    # Owner-authorized daily silent Reels; config.json controls publication.
    # No repository-variable setup is required.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow requests
      - name: Install video renderer
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Test Circus safeguards
        run: python -m unittest discover -s circus/tests -v
      - name: Preview only on manual dispatch or code change
        if: github.event_name != 'schedule'
        run: python circus/reels/pipeline.py --preview --output preview/circus-reel
      - name: Verify Instagram credentials without publishing
        if: github.event_name == 'push'
        env:
          CIRCUS_IG_ACCESS_TOKEN: ${{ secrets.CIRCUS_IG_ACCESS_TOKEN }}
          CIRCUS_IG_USER_ID: ${{ secrets.CIRCUS_IG_USER_ID }}
        run: python circus/reels/pipeline.py --check-account
      - name: Run scheduled Circus production
        if: github.event_name == 'schedule'
        env:
          CIRCUS_IG_ACCESS_TOKEN: ${{ secrets.CIRCUS_IG_ACCESS_TOKEN }}
          CIRCUS_IG_USER_ID: ${{ secrets.CIRCUS_IG_USER_ID }}
        run: python circus/reels/pipeline.py
      - name: Upload reviewable Reel and script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circus-reel-${{ github.run_id }}
          path: |
            preview/circus-reel/
            docs/circus-reels/
          if-no-files-found: ignore
          retention-days: 14
