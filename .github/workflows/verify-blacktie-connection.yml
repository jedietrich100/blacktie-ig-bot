name: Verify Black Tie connection
on:
  workflow_dispatch: {}
  push:
    branches: ["codex/verify-blacktie-connection-20261001"]
    paths: [".github/workflows/verify-blacktie-connection.yml"]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check account identity and recent media (read only)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import http.client
          import json
          import os
          import re
          import sys
          
          EXPECTED_USERNAME = "blacktie_intel"
          EXPECTED_ID = "17841434445662205"
          
          def fail(message):
              print("FAIL: " + message)
              raise SystemExit(1)
          
          def request_json(path, token):
              connection = http.client.HTTPSConnection("graph.instagram.com", timeout=30)
              try:
                  connection.request("GET", path, headers={"Authorization": "Bearer " + token})
                  response = connection.getresponse()
                  raw = response.read(262145)
                  if len(raw) > 262144:
                      fail("Instagram response exceeded the safety limit")
                  try:
                      payload = json.loads(raw)
                  except (ValueError, UnicodeError):
                      fail("Instagram returned an unreadable response")
                  if response.status != 200:
                      code = payload.get("error", {}).get("code") if isinstance(payload, dict) else None
                      suffix = ("; Meta code " + str(code)) if type(code) is int else ""
                      fail("Instagram HTTP " + str(response.status) + suffix)
                  if not isinstance(payload, dict):
                      fail("Instagram returned an unexpected response")
                  return payload
              except SystemExit:
                  raise
              except Exception:
                  fail("Instagram request did not complete; no credential details logged")
              finally:
                  connection.close()
          
          def main():
              token = os.environ.get("IG_ACCESS_TOKEN", "").strip()
              if not token:
                  fail("IG_ACCESS_TOKEN is missing")
              account = request_json("/v26.0/me?fields=user_id,username,id", token)
              account_id = str(account.get("user_id") or account.get("id") or "")
              if account.get("username") != EXPECTED_USERNAME or account_id != EXPECTED_ID:
                  fail("Saved token does not resolve to the expected Black Tie account")
              print("PASS: authenticated @" + EXPECTED_USERNAME + " (" + EXPECTED_ID + ")")
              media = request_json("/v26.0/" + EXPECTED_ID + "/media?fields=id,timestamp,permalink&limit=100", token)
              rows = media.get("data")
              if not isinstance(rows, list):
                  fail("Could not inspect the account's recent media")
              today = datetime.datetime.now(datetime.timezone.utc).date()
              count = 0
              for row in rows:
                  try:
                      stamp = datetime.datetime.fromisoformat(row["timestamp"].replace("Z", "+00:00"))
                      if stamp.tzinfo is None:
                          raise ValueError()
                      posted_date = stamp.astimezone(datetime.timezone.utc).date()
                  except (TypeError, KeyError, ValueError, AttributeError):
                      fail("Recent-media timestamp could not be validated")
                  if posted_date == today:
                      count += 1
                      media_id = str(row.get("id", ""))
                      if re.fullmatch(r"[0-9]+", media_id):
                          print("TODAY_MEDIA_ID: " + media_id)
                      permalink = row.get("permalink", "")
                      if isinstance(permalink, str) and re.fullmatch(r"https://www[.]instagram[.]com/(?:p|reel|tv)/[A-Za-z0-9_-]+/?", permalink):
                          print("TODAY_PERMALINK: " + permalink)
              print("CHECK_DATE_UTC: " + today.isoformat())
              print("TODAY_MEDIA_COUNT: " + str(count))
              print("PASS: read-only verification complete; no publishing requests made")
          
          if __name__ == "__main__":
              main()
          
          PY
